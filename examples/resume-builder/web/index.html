<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kdnk — resume-builder example</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #121212; color: #e6e6e6; }
  main { max-width: 46rem; margin: 0 auto; padding: 2rem 1rem; }
  h1 { font-size: 1.1rem; font-weight: 600; color: #9a9a9a; }
  #chat { border: 1px solid #2c2c2c; border-radius: 6px; height: 26rem; overflow-y: auto; padding: 1rem; }
  .msg { margin-bottom: 0.85rem; line-height: 1.5; white-space: pre-wrap; }
  .role { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #7a7a7a; margin-bottom: 0.2rem; }
  .tool { font-family: ui-monospace, monospace; font-size: 0.8rem; color: #6fd0a8; border-left: 2px solid #2f5c4a; padding-left: 0.6rem; margin-bottom: 0.85rem; white-space: pre-wrap; }
  .err { color: #ff6b6b; }
  form { display: flex; gap: 0.5rem; margin-top: 1rem; }
  input { flex: 1; padding: 0.6rem; background: #1c1c1c; color: #e6e6e6; border: 1px solid #2c2c2c; border-radius: 4px; }
  button { padding: 0.6rem 1.1rem; border: 0; border-radius: 4px; background: #e6e6e6; color: #121212; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
  #auth { display: none; }
  #auth.show { display: flex; }
  #form.hide { display: none; }
  #account { margin: 0.7rem 0 0; text-align: right; font-size: 0.8rem; }
  #account a { color: #7a7a7a; }
</style>
</head>
<body>
<main>
  <h1>kdnk — resume-builder example</h1>
  <div id="chat"></div>
  <form id="auth">
    <input id="email" type="email" autocomplete="username" placeholder="email">
    <input id="password" type="password" autocomplete="current-password" placeholder="password">
    <button id="upgrade" type="button">Save account</button>
    <button id="signin" type="button">Sign in</button>
  </form>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Add a task, or ask what is on the list…">
    <button id="send" type="submit">Send</button>
  </form>
  <p id="account"><a href="#" id="accountToggle">save your account</a></p>
</main>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');

const auth = document.getElementById('auth');
const email = document.getElementById('email');
const password = document.getElementById('password');
const upgrade = document.getElementById('upgrade');
const signin = document.getElementById('signin');
const accountToggle = document.getElementById('accountToggle');

const TOKEN_KEY = 'kdnk.resume-builder.token';
const GUEST_KEY = 'kdnk.resume-builder.guest';
const CONVERSATION_KEY = 'kdnk.resume-builder.conversation';

let token = localStorage.getItem(TOKEN_KEY) || '';

let conversationId = localStorage.getItem(CONVERSATION_KEY);
if (!conversationId) {
  conversationId = crypto.randomUUID();
  localStorage.setItem(CONVERSATION_KEY, conversationId);
}

const messages = [];

function bubble(role, text) {
  const el = document.createElement('div');
  el.className = 'msg';
  const label = document.createElement('span');
  label.className = 'role';
  label.textContent = role;
  el.appendChild(label);
  const body = document.createElement('span');
  body.textContent = text || '';
  el.appendChild(body);
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return body;
}

function note(text, extraClass) {
  const el = document.createElement('div');
  el.className = extraClass ? 'tool ' + extraClass : 'tool';
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

function handleFrame(frame, state) {
  if (frame.type === 'text-start') {
    state.targets[frame.id] = bubble('assistant', '');
  } else if (frame.type === 'text-delta') {
    const target = state.targets[frame.id];
    if (target) {
      target.textContent += frame.delta;
      state.text += frame.delta;
      chat.scrollTop = chat.scrollHeight;
    }
  } else if (frame.type === 'tool-input-available') {
    note('→ ' + frame.toolName + ' ' + JSON.stringify(frame.input));
  } else if (frame.type === 'tool-output-available') {
    note('← ' + frame.output);
  } else if (frame.type === 'error') {
    note(frame.errorText, 'err');
  }
}

function renderStored(msg) {
  for (const part of msg.parts || []) {
    if (part.type === 'text') {
      if (part.text) bubble(msg.role === 'user' ? 'you' : 'assistant', part.text);
    } else if (part.type.startsWith('tool-') && part.data) {
      note('→ ' + part.data.toolName + ' ' + JSON.stringify(part.data.input));
      note('← ' + part.data.output);
    }
  }
}

async function pb(path) {
  const res = await fetch('/api/collections/' + path, { headers: { Authorization: token } });
  if (!res.ok) {
    const err = new Error('HTTP ' + res.status);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

async function loadHistory() {
  const convs = await pb('chat_conversation/records?perPage=1&filter='
    + encodeURIComponent('external_conversation_id="' + conversationId + '"'));
  if (!convs.items.length) return;

  const stored = await pb('chat_message/records?perPage=500&sort=seq&filter='
    + encodeURIComponent('conversation="' + convs.items[0].id + '"'));
  for (const rec of stored.items) {
    renderStored(rec.content);
    if (rec.content.role === 'user') messages.push(rec.content);
  }
}

function isGuest() {
  return Boolean(localStorage.getItem(GUEST_KEY));
}

function setSignedIn(on) {
  auth.classList.toggle('show', !on);
  form.classList.toggle('hide', !on);
  upgrade.disabled = !on || !isGuest();
  accountToggle.textContent = isGuest() ? 'save your account' : 'sign in';
  if (on) input.focus(); else email.focus();
}

function signOut(reason) {
  token = '';
  localStorage.removeItem(TOKEN_KEY);
  setSignedIn(false);
  if (reason) note(reason, 'err');
}

function acceptAuth(body) {
  token = body.token;
  localStorage.setItem(TOKEN_KEY, token);
}

async function doSignIn() {
  try {
    const res = await fetch('/api/collections/users/auth-with-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identity: email.value.trim(), password: password.value }),
    });
    if (!res.ok) {
      note('sign in failed: HTTP ' + res.status, 'err');
      return;
    }
    localStorage.removeItem(GUEST_KEY);
    acceptAuth(await res.json());
    location.reload();
  } catch (err) {
    note(String(err), 'err');
  }
}

async function doUpgrade() {
  try {
    const res = await fetch('/api/guest/upgrade', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: token },
      body: JSON.stringify({ email: email.value.trim(), password: password.value }),
    });
    if (!res.ok) {
      note('could not save account: HTTP ' + res.status, 'err');
      return;
    }
    localStorage.removeItem(GUEST_KEY);
    acceptAuth(await res.json());
    password.value = '';
    auth.classList.remove('show');
    setSignedIn(true);
    note('account saved — sign in with this email and password next time');
  } catch (err) {
    note(String(err), 'err');
  }
}

auth.addEventListener('submit', (event) => {
  event.preventDefault();
  if (isGuest()) doUpgrade(); else doSignIn();
});

signin.addEventListener('click', doSignIn);
upgrade.addEventListener('click', doUpgrade);

accountToggle.addEventListener('click', (event) => {
  event.preventDefault();
  auth.classList.toggle('show');
  email.focus();
});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  send.disabled = true;
  bubble('you', text);
  messages.push({ id: crypto.randomUUID(), role: 'user', parts: [{ type: 'text', text }] });

  const state = { targets: {}, text: '' };

  const post = () => fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: token },
    body: JSON.stringify({ id: conversationId, messages }),
  });

  try {
    let res = await post();

    if (res.status === 401) {
      signOut();
      await ensureAuth();
      setSignedIn(true);
      res = await post();
    }
    if (!res.ok) {
      note('HTTP ' + res.status + ': ' + (await res.text()), 'err');
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let split;
      while ((split = buffer.indexOf('\n\n')) !== -1) {
        const raw = buffer.slice(0, split);
        buffer = buffer.slice(split + 2);
        if (!raw.startsWith('data: ')) continue;
        const payload = raw.slice(6);
        if (payload === '[DONE]') continue;
        try {
          handleFrame(JSON.parse(payload), state);
        } catch (e) {
          note('bad frame: ' + payload, 'err');
        }
      }
    }

  } catch (err) {
    note(String(err), 'err');
  } finally {
    send.disabled = false;
    input.focus();
  }
});

function storedGuest() {
  try {
    return JSON.parse(localStorage.getItem(GUEST_KEY));
  } catch (err) {
    return null;
  }
}

async function authAsGuest(guest) {
  const res = await fetch('/api/collections/users/auth-with-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ identity: guest.guestId, password: guest.password }),
  });
  if (!res.ok) return false;
  acceptAuth(await res.json());
  return true;
}

async function newGuest() {
  const res = await fetch('/api/guest', { method: 'POST' });
  if (!res.ok) throw new Error('guest sign-in failed: HTTP ' + res.status);
  const body = await res.json();
  localStorage.setItem(GUEST_KEY, JSON.stringify(body.meta));
  acceptAuth(body);
}

async function ensureAuth() {
  if (token) return;
  const guest = storedGuest();
  if (guest && guest.guestId && await authAsGuest(guest)) return;
  localStorage.removeItem(GUEST_KEY);
  await newGuest();
}

async function start() {
  await ensureAuth();
  setSignedIn(true);
  try {
    await loadHistory();
  } catch (err) {
    if (err.status !== 401) throw err;
    signOut();
    await ensureAuth();
    setSignedIn(true);
    await loadHistory();
  }
}

start().catch((err) => {
  setSignedIn(false);
  note(String(err), 'err');
});
</script>
</body>
</html>
