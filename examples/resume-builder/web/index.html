<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>kdnk — resume-builder example</title>
<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; background: #0b0f0d; color: #b8d8c8; }
  main { max-width: 46rem; margin: 0 auto; padding: 2rem 1rem; }
  h1 { font-size: 1.1rem; font-weight: 600; color: #5f7f6f; letter-spacing: 0.04em; }
  #log { border: 1px solid #1e2b24; border-radius: 6px; height: 26rem; overflow-y: auto; padding: 1rem; background: #0d1411; }
  .msg { margin-bottom: 0.85rem; line-height: 1.55; white-space: pre-wrap; }
  .role { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #4d6a5b; margin-bottom: 0.2rem; }
  .you .role { color: #7a8f5f; }
  .tool { font-size: 0.78rem; color: #6fd0a8; border-left: 2px solid #24483a; padding-left: 0.6rem; margin-bottom: 0.85rem; white-space: pre-wrap; }
  .err { color: #ff6b6b; border-left-color: #4a2222; }
  form { display: flex; gap: 0.5rem; margin-top: 1rem; }
  input { flex: 1; padding: 0.6rem; background: #0d1411; color: #b8d8c8; border: 1px solid #1e2b24; border-radius: 4px; font: inherit; }
  button { padding: 0.6rem 1.1rem; border: 0; border-radius: 4px; background: #6fd0a8; color: #0b0f0d; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: 0.35; cursor: default; }
  #auth { display: none; }
  #auth.show { display: flex; }
  #form.hide { display: none; }
  #account { margin: 0.7rem 0 0; text-align: right; font-size: 0.8rem; }
  #account a { color: #4d6a5b; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
